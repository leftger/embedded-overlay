[package]
name = "embedded-overlay"
version = "0.1.0"
edition = "2021"
authors = ["Gerzain Mata <leftger@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Hardware-agnostic RAM-paged code overlays with async streaming DMA and streamable VFS for embedded Rust"
keywords = ["embedded", "no-std", "overlay", "dma", "vfs"]
categories = ["embedded", "no-std", "memory-management"]
repository = "https://github.com/leftger/embedded-overlay"
homepage = "https://github.com/leftger/embedded-overlay"
documentation = "https://docs.rs/embedded-overlay"
readme = "README.md"

[features]
default = []
std = []
defmt = ["dep:defmt"]
cortex-m = ["dep:cortex-m"]

[[bin]]
name = "overlay-packer"
path = "src/bin/packer.rs"
required-features = ["std"]

[dependencies]
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
defmt = { version = "0.3.10", optional = true }
cortex-m = { version = "0.7.7", optional = true }

[dev-dependencies]
sequential-storage = "8.0.1"

[package.metadata.docs.rs]
all-features = true
targets = [
    "thumbv6m-none-eabi",
    "thumbv7m-none-eabi",
    "thumbv7em-none-eabi",
    "thumbv7em-none-eabihf",
    "thumbv8m.main-none-eabihf",
    "x86_64-unknown-linux-gnu",
]
