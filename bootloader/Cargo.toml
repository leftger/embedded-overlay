[package]
name = "wba-dual-bootloader"
version = "0.1.0"
edition = "2021"
authors = ["Gerzain Mata <leftger@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Dual-Memory Bootloader for STM32WBA65RI with on-chip internal and external SPI flash programming"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "0.3.10"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }
embedded-overlay = { path = ".." }

[build-dependencies]
cortex-m-rt = "0.7.5"
