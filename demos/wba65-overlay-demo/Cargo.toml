[package]
name = "wba65-overlay-demo"
version = "0.1.0"
edition = "2021"
authors = ["Gerzain Mata <leftger@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "STM32WBA65RI demonstration of dynamic RAM-paged overlays, streamable VFS, and sequential-storage partitioning"

[dependencies]
embassy-stm32 = { path = "../../../../embassy-project/embassy/embassy-stm32", features = ["defmt", "stm32wba65ri", "memory-x", "time-driver-any"] }
embassy-executor = { path = "../../../../embassy-project/embassy/embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { path = "../../../../embassy-project/embassy/embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { path = "../../../../embassy-project/embassy/embassy-sync", features = ["defmt"] }
embedded-overlay = { path = "../..", features = ["cortex-m", "defmt", "embassy"] }
sequential-storage = "8.0.1"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "0.3.10"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

[build-dependencies]
cortex-m-rt = "0.7.5"
